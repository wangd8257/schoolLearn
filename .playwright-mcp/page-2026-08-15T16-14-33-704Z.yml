              - paragraph [ref=f1e319]: 致我的两个外孙，大卫·格蕾丝和埃利奥特·艾萨克·麦吉尔特。
              - paragraph [ref=f1e320]: ——盖瑞·查普曼博士
              - paragraph [ref=f1e321]: 致我的外孙和他们的兄弟姐妹。
              - paragraph [ref=f1e322]: 我愿他们（以及这本书的小读者们）发现上帝的爱是多么的神奇，也愿他们学会用自己的方式去爱。
              - paragraph [ref=f1e323]: ——瑞克·奥斯本
              - paragraph [ref=f1e324]: 致那些从孩童时代起就给予我支持、给予我灵感的人们，特别是我的母亲、父亲和妹妹。谢谢你们。
              - paragraph [ref=f1e325]: ——小威尔森·威廉姆斯
              - paragraph [ref=f1e326]
              - paragraph [ref=f1e328]: “起 床了，懒虫们！今天是个重要的日子！ ”
              - paragraph [ref=f1e329]: 这的确是非常、非常特别的一天！佩顿和彭妮是一对双胞胎兄妹，他们已经想好了今天要做些什么，也已经给了爸爸、妈妈很多暗示。
              - paragraph [ref=f1e330]: “但愿他们明白了我们的暗示。”彭妮兴奋地说。
              - paragraph [ref=f1e331]: 佩顿伸了个懒腰说道：“是呀，但是看爸妈的表现，他们好像一点儿也没明白我们的意思。等待惊喜 总是这么难熬啊。”佩顿吸了口气，“哇！妈妈在做煎饼！”
              - paragraph [ref=f1e332]: 兄妹俩飞快地冲下楼。
              - paragraph [ref=f1e333]
              - paragraph [ref=f1e335]: 寻找昆虫：
              - paragraph [ref=f1e336]: 在这本书里面，每一张大图片中至少有一只昆虫。看看你能把他们都找出来吗？祝你们玩儿得开心！
              - paragraph [ref=f1e337]
              - paragraph [ref=f1e339]
              - paragraph [ref=f1e341]: 彭妮 做了晨祷，她又给了一个暗示，谢谢上帝赐给他们一次生日大冒险。
              - paragraph [ref=f1e342]: 爸爸咯咯地笑着说：“猜猜我们今天要去哪儿？”
              - paragraph [ref=f1e343]: 佩顿觉得他得说出来了：“查普曼先生开的理想宠物伙伴中心？ ”
              - paragraph [ref=f1e344]: 彭妮也请求道：“去吧，去吧，去吧？”
              - paragraph [ref=f1e345]: 妈妈笑了笑便答应道：“好吧。”
              - paragraph [ref=f1e346]: 两个小朋友激动极了，他们马上就要去全世界 最棒的宠物店了！那里既像是一个动物园，也像是一座博物馆，一个主题公园，更是个生日派对乐园，简直是个多功能的乐园。
              - paragraph [ref=f1e347]: 没过多久，佩顿便去帮妈妈和妹妹打开了家用卡车 的门。彭妮爬进去坐到爸爸身旁，说道：“爸爸，你知道我们所有的暗示了吧？”
              - paragraph [ref=f1e348]
              - paragraph [ref=f1e350]:
                - generic [ref=f1e351]: 在宠物伙伴中心门外，这些动物你能找到多少只？
                - generic [ref=f1e352]: 雷龙、灰熊、帝企鹅、长颈鹿、白头海雕、北美驯鹿、袋鼠、兔子
              - paragraph [ref=f1e353]: “噢， 我知道你们所有的暗示了，”爸爸笑着说：“你们要在那儿开一个派对……”（双胞胎兄妹又欢呼起来）“……还有，你们还要找到理想的宠物伙伴。”
              - paragraph [ref=f1e354]: 这次，佩顿的欢呼声没那么大了。查普曼先生会为每一位顾客配上一只理想的宠物。佩顿知道，彭妮想要一个理想的宠物伙伴陪 着她，但是他觉得宠物配对可能不太适合自己。他只是很期待他们的派对。
              - paragraph [ref=f1e355]: 妈妈微笑着说：“还有个惊喜给你们，你们可没有提过哦。还有你们的小伙伴们，他们的爸爸妈妈也会去给他们选宠物。”
              - paragraph [ref=f1e356]: “太好啦！” 彭妮说道。
              - paragraph [ref=f1e357]
              - paragraph [ref=f1e359]:
                - generic [ref=f1e360]: 查普曼先生走到哪儿，小动物们就跟到哪儿。你知道跟着他的那些小动物的名字吗？
                - generic [ref=f1e361]: （你可以找出七只小动物。）
              - paragraph [ref=f1e362]: 佩顿 打开大门。他一直想要的是一只超级宠物——比如马戏团里的动物，或者一匹马——可以帮忙做些事情的那种。他不想要一只普普通通的宠物，尽管其他人都会找到那样的宠物。
              - paragraph [ref=f1e363]: “你们就是佩顿和彭妮吧，”查普曼先生说道，“听说你们今天想找到理想的宠物伙伴哦。”
              - paragraph [ref=f1e364]: “我不太确定哎。”佩顿答道。
              - paragraph [ref=f1e365]: 正在这时，一只超级可爱的猴子拿出一袋糖豆， 把兄妹俩吓了一跳，彭妮还吓得尖叫了一声。
              - paragraph [ref=f1e366]: “给你们过生日的朋友都来了，正在里面逛着呢。”查普曼先生说道。
              - paragraph [ref=f1e367]: 而彭妮和佩顿已经开始往里面走了。
              - paragraph [ref=f1e368]
              - paragraph [ref=f1e370]: 兄妹俩 扫了一眼地图。彭妮特别想去爱宠动物园和海洋馆，海洋馆里还有海底世界观光隧道。 佩顿感兴趣的则是各种各样的小鸟，他也特别想去爬行动物馆，那儿有和真的恐龙一样大的恐龙模型，他们还会动呢。
              - paragraph [ref=f1e371]: “你想先去哪儿呢，小妹？这儿太大啦！”
              - paragraph [ref=f1e372]: “我们一起逛吧，然后轮流挑选要去的馆。”彭妮回答道。
              - paragraph [ref=f1e373]: 他们正要出发去探索，便听见动物们发出的各种叫声，就像一支不可思议的交响乐， 似乎在召唤着他们。
              - paragraph [ref=f1e374]
              - paragraph [ref=f1e376]:
                - generic [ref=f1e377]: 你能找出这些禽类吗？
                - generic [ref=f1e378]: 凤头鹦鹉、鸭子、小鸭子、亚马逊绿鹦鹉、非洲灰鹦鹉、太阳鹦哥、黄丝雀、红丝雀、苍鹭、海雀、火烈鸟、巨嘴鸟、蜂鸟
              - paragraph [ref=f1e379]: 他们首先去的是禽类 馆。这儿简直是个漂亮的乐园，到处都能听见美丽的鸟儿在歌唱，到处都能看见绚丽的色彩，还有鸟儿扑腾着的翅膀。
              - paragraph [ref=f1e380]: 看到好朋友婕拉蹦蹦跳跳 地走过来，彭妮笑得合不拢嘴。她很爱和婕拉待在一起。
              - paragraph [ref=f1e381]: “生日快乐！”婕拉说道，“你们的生日派对可选对地方了！你俩太棒啦！”
              - paragraph [ref=f1e382]: “太！太棒啦！” 一只非洲灰鹦鹉说道。
              - paragraph [ref=f1e383]: “我喜欢那只鸟。”婕拉夸张地说。她们都笑了起来。
              - paragraph [ref=f1e384]
              - paragraph [ref=f1e386]:
                - generic [ref=f1e387]: 你能找出下列哪些动物呢？
                - generic [ref=f1e388]: 猪、公鸡、母鸡、兔子、边境牧羊犬、美洲鸵、小鸡、山羊、绵羊、奶牛、马、老鼠
              - paragraph [ref=f1e389]: 当他们走进农院时，婕拉 深吸一口气，打了个喷嚏。
              - paragraph [ref=f1e390]: “哇！这里简直连气味都这么像模像样的！”她大喊道。
              - paragraph [ref=f1e391]: “爱宠动物园在哪儿呢？”彭妮疑惑地问道。
              - paragraph [ref=f1e392]: “汪汪！”一只小狗轻轻碰了一下佩顿，便跑去推开一扇门。有个标志写道：爱宠动物园。
              - paragraph [ref=f1e393]: “好孩子！”婕拉夸道。
              - paragraph [ref=f1e394]: 彭妮看到了她的另一个朋友索菲亚，她正抱着一只棕白相间的兔子。
              - paragraph [ref=f1e395]: “抱一抱，生日快乐！” 索菲亚一边唱着，一边做出单手拥抱的动作。然后她又告诉朋友们哪些动物最温顺、摸起来最舒服，他们是最适合去抚摸的。
              - paragraph [ref=f1e396]
              - paragraph [ref=f1e398]:
                - generic [ref=f1e399]: 你能找到这些水下生物吗？
                - generic [ref=f1e400]: 海星、大白鲨、蓝鲸、海豚、海马、小丑鱼、黄貂鱼、刺猬鱼、水母、黑白纹鱼
              - paragraph [ref=f1e401]: 正当他们 前往水族馆的时候，佩顿发现有个小家伙跟着彭妮和索菲亚。他把毛绒绒的小跟班抱给她们摸，她俩开心得咯咯直笑。
              - paragraph [ref=f1e402]: 在壮观的海洋馆中心，海豚们在表演，他们在帮水族馆 的员工做一些有用的事情。海豚会是我的理想宠物，佩顿想着。他觉得有些失落，因为他不能把他真正喜欢的那种动物带回家。
              - paragraph [ref=f1e403]
              - paragraph [ref=f1e405]:
                - generic [ref=f1e406]: 你能找到这些爬行动物和恐龙吗？
                - generic [ref=f1e407]: 壁虎、乌龟、雷龙、剑龙、无齿翼龙、雷克斯暴龙、绿树蟒、尼罗河巨蜥
              - paragraph [ref=f1e408]: 佩顿 走向爬行动物馆，恐龙让他变得兴奋起来。看到他的朋友凯文在那儿，他也很开心。
              - paragraph [ref=f1e409]: “生日快乐！”凯文大声说道，“在看到礼物之前，你得等着喽！对了，你看到那只很酷的猴子了吗？他给了我糖豆哦。”
              - paragraph [ref=f1e410]: 男孩们刚刚秘密地握了手， 女孩们便走过来了。
              - paragraph [ref=f1e411]: 查普曼先生也跟了进来，说：“你们都在一起啦，派对十分钟内开始。”
              - paragraph [ref=f1e412]: “谢谢。”婕拉说道，“谢谢你告诉我们。”说完，她突然大叫了一声，原来有只机器恐龙 用鼻子蹭了蹭她的肩。
              - paragraph [ref=f1e413]
              - paragraph [ref=f1e415]:
                - generic [ref=f1e416]: 你能找出匹萨上面所有的假爬虫吗？
                - generic [ref=f1e417]: 黄蜂、蚱蜢、蜻蜓、红蚁、毛毛虫、天牛、黑蚁、瓢虫、竹节虫、狼蛛
              - paragraph [ref=f1e418]
              - paragraph [ref=f1e420]: 小朋友们 都坐下了，他们还是笑个不停。
              - paragraph [ref=f1e421]: “没那么好笑吧。”婕拉说道。彭妮坐在她妈妈旁边，这时匹萨送来了。
              - paragraph [ref=f1e422]: “这个叫做双倍奶酪汉堡包匹萨，” 查普曼先生说道，“这一个呢，是疯狂爬虫创意匹萨。” 他笑着继续说：“不想吃蜘蛛的话，把它们挑出来就是了。”
              - paragraph [ref=f1e423]: 虽然这些虫子都不是真的，索菲亚还是很不安地动了动。佩顿站了起来，开始把匹萨分给大家。
              - paragraph [ref=f1e424]: 婕拉很喜欢这种匹萨：“你俩的派对棒极了！”
              - paragraph [ref=f1e425]
              - paragraph [ref=f1e427]:
                - generic [ref=f1e428]: 你能指出这些神话动物在冰激凌圣代周围的哪个位置吗？
                - generic [ref=f1e429]: 独角兽、龙、狮鹫、半人马、巨人、七头龙、大脚怪、美人鱼、大海兽
              - paragraph [ref=f1e430]: 接下来 的东西让大家惊讶地大吸一口气。
              - paragraph [ref=f1e431]
              - paragraph [ref=f1e433]: “这是神话怪物 圣代，”查普曼先生介绍道，“里面有巧克力块和樱桃味冰激凌，上面是糖果棒的碎末和覆盆子果浆。 最顶上有红色的鲜奶油、棉花糖和燃烧着的糖棍。当然还有环绕在周围的神话动物，它们是用糖做的。”
              - paragraph [ref=f1e434]
              - paragraph [ref=f1e436]: 大家都唱起了生日歌， 索菲亚欢快地抱了抱双胞胎兄妹，还脸贴着脸呢。
              - paragraph [ref=f1e437]
              - paragraph [ref=f1e439]: “这比匹萨还好吃！”婕拉大声说道。佩顿则帮大家舀出 圣代。
              - paragraph [ref=f1e440]
              - paragraph [ref=f1e442]: “礼物时间 到了！”凯文一边说话一边把包好的礼物堆在桌子上。
              - paragraph [ref=f1e443]: 朋友们总是会送一些好笑的礼物。
              - paragraph [ref=f1e444]
              - paragraph [ref=f1e446]: 这次，婕拉送给双胞胎兄妹的是毛绒河马，只要碰一下它们，它们就会说话。它们会说：“你最像河马啦！”
              - paragraph [ref=f1e447]
              - paragraph [ref=f1e449]: 凯文送了两顶很好笑的大帽子 给他们，大家都被逗乐了。
              - paragraph [ref=f1e450]
              - paragraph [ref=f1e452]: 索菲亚给他们一人一本手工制作的“拥抱之书”， 它是用来记录拥抱的。“我的最高记录是一天内有55个拥抱哦。”索菲亚说道。
              - paragraph [ref=f1e453]: 每个朋友彭妮都陪了一会儿，和他们聊了聊那些很棒的礼物。
              - paragraph [ref=f1e454]: 砰！砰！砰！
              - paragraph [ref=f1e455]: 小朋友们转过身就看见一个人在表演，他拿着一个别针和一些气球，故作神秘地笑着。
              - paragraph [ref=f1e456]: “好玩儿的气球！每个人都来一个吧！”他说道，声音很高，说得也很快。
              - paragraph [ref=f1e457]: 他开始飞快地把气球 拧在一起。
              - paragraph [ref=f1e458]
              - paragraph [ref=f1e460]: “太可爱了！”婕拉大喊道，那个人递给她一只长颈鹿。
              - paragraph [ref=f1e461]
