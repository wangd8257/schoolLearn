              - paragraph [ref=f1e631]: 如果你已经能确定他们会用的两种爱的语言，那么你就可以带着他们去做小测试了，完成后可以和他们一起讨论答案。如果你重新又读了一遍这个故事，那就请让他们再做一到两组测试题，并记下他们的答案。他们反应最积极的那些问题，应该会和他们最重要的爱的语言有所关联。
